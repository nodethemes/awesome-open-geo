name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  awesome-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # awesome-git-repo-age fails until the repo is 30 days old; it is the one
      # rule a young list cannot satisfy, so it is reported but not fatal.
      - run: npx awesome-lint || true
